<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 570" role="img" aria-labelledby="quoteTitle"><title id="quoteTitle">Three fictional quote graphics with supported, conflicting, and unverified attributions</title><rect x="1" y="1" width="718" height="568" rx="14" fill="white" stroke="#cbd5e1" stroke-width="2"/><g font-family="sans-serif" fill="#1e293b"><rect x="20" y="20" width="680" height="160" rx="12" fill="#eff6ff" stroke="#93c5fd"/><text x="42" y="50" font-size="18" font-weight="700">Q1 — fictional quote card</text><text x="360" y="90" text-anchor="middle" font-size="24">Try one small change,</text><text x="360" y="120" text-anchor="middle" font-size="24">then check what happened.</text><text x="644" y="155" text-anchor="end" font-size="20">— Jo</text><rect x="20" y="195" width="680" height="160" rx="12" fill="#eff6ff" stroke="#93c5fd"/><text x="42" y="225" font-size="18" font-weight="700">Q2 — fictional quote card</text><text x="360" y="265" text-anchor="middle" font-size="24">Try one small change,</text><text x="360" y="295" text-anchor="middle" font-size="24">then check what happened.</text><text x="644" y="330" text-anchor="end" font-size="20">— Mae</text><rect x="20" y="370" width="680" height="160" rx="12" fill="#eff6ff" stroke="#93c5fd"/><text x="42" y="400" font-size="18" font-weight="700">Q3 — fictional quote card</text><text x="360" y="440" text-anchor="middle" font-size="24">Every drawing wins a prize.</text><text x="360" y="470" text-anchor="middle" font-size="24"></text><text x="644" y="505" text-anchor="end" font-size="20">— Mae</text></g></svg>
